services:
  - type: web
    name: school-management-api
    runtime: python3
    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        value: https://your-render-app.onrender.com
      - key: DEBUG
        value: false
databases:
  - name: school-db
    databaseName: school_db
    user: school_user