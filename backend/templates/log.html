<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bright Brains Christian Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E2A38',
                        secondary: '#2F80C0',
                        accent: '#C0392B',
                        gold: '#D4AF37',
                        bgLight: '#F8FAFC',
                        card: '#FFFFFF',
                        border: '#E5E7EB',
                        textPrimary: '#111827',
                        textSecondary: '#6B7280',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bgLight min-h-screen flex items-center justify-center">
    <div class="bg-card p-8 rounded-lg shadow-md w-full max-w-md border border-border">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-textPrimary">Bright Brains Christian Academy</h1>
            <p class="text-textSecondary mt-2">School Management System</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-textPrimary">Email</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 block w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-secondary focus:border-secondary text-textPrimary placeholder-textSecondary" placeholder="your@email.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-textPrimary">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-secondary focus:border-secondary text-textPrimary placeholder-textSecondary" placeholder="Your password">
            </div>

            <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-secondary hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary">
                Sign In
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-sm text-textSecondary hidden"></div>

        <div class="mt-6 text-center">
            <a href="/home" class="text-secondary hover:text-blue-700">Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    messageDiv.className = 'mt-4 text-center text-sm text-green-600';
                    messageDiv.textContent = 'Login successful! Redirecting...';

                    const meResponse = await fetch('/users/me', {
                        headers: {
                            'Authorization': `Bearer ${data.access_token}`
                        }
                    });
                    const me = await meResponse.json();

                    setTimeout(() => {
                        if (me.role === 'admin') {
                            window.location.href = '/dashboard/admin';
                        } else if (me.role === 'teacher') {
                            window.location.href = '/dashboard/teacher';
                        } else {
                            window.location.href = '/dashboard/student';
                        }
                    }, 700);
                } else {
                    messageDiv.className = 'mt-4 text-center text-sm text-red-600';
                    messageDiv.textContent = data.detail || 'Login failed';
                }
            } catch (error) {
                messageDiv.className = 'mt-4 text-center text-sm text-red-600';
                messageDiv.textContent = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
